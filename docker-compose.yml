services:
  postgres:
    image: postgres:17
    container_name: security-lab
    environment:
      POSTGRES_DB: security-lab
      POSTGRES_USER: security-lab
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - security_lab_data:/var/lib/postgresql/data

volumes:
  security_lab_data: